[package]
name = "sextant-live"
version.workspace = true
edition.workspace = true
description = "Sextant live trading — OKX demo via NautilusTrader LiveNode"
license.workspace = true

[[bin]]
name = "sextant-live"
path = "src/main.rs"

[dependencies]
nautilus-core = { workspace = true }
nautilus-model = { workspace = true }
nautilus-common = { workspace = true }
nautilus-trading = { workspace = true }
nautilus-live = { workspace = true }
nautilus-okx = { workspace = true }
nautilus-agent-swarm = { path = "../agent_swarm" }
nautilus-state-encoder = { path = "../state_encoder" }
tokio = { workspace = true }
tracing = { workspace = true }
log = "0.4"
anyhow = { workspace = true }
async-trait = { workspace = true }
dotenvy = "0.15"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
