[package]
name = "sextant-gui"
version.workspace = true
edition.workspace = true
description = "Desktop GUI for Sextant trading engine (egui)"
license.workspace = true

[[bin]]
name = "sextant-gui"
path = "src/main.rs"

[features]
default = []
charts = ["egui-charts"]

[dependencies]
nautilus-state-encoder = { path = "../state_encoder" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.31"
egui_dock = { version = "0.16", features = ["serde"] }
egui_extras = { version = "0.31", features = ["serde"] }
egui_plot = "0.31"
egui-charts = { version = "0.1", optional = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
