[package]
name = "sextant-gui"
version.workspace = true
edition.workspace = true
description = "Desktop GUI for Sextant trading engine (egui)"
license.workspace = true

[[bin]]
name = "sextant-gui"
path = "src/main.rs"

[features]
default = []

[dependencies]
nautilus-state-encoder = { path = "../state_encoder" }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.31"
egui_extras = { version = "0.31", features = ["serde"] }
egui_plot = "0.31"
chrono = "0.4"
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = "0.3"
